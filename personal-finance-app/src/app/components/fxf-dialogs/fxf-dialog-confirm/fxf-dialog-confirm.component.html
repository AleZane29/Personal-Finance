<h2 mat-dialog-title>{{ this.data.title }}</h2>
<mat-dialog-content>
  <p>{{ this.data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button mat-dialog-close (click)="confirmClick()">Confirm</button>
</mat-dialog-actions>
